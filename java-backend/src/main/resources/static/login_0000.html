<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - PayBank Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🔐 Connexion</h1>
        
        <form onsubmit="simulerConnexion(event)">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full border p-2 rounded">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="password" required class="w-full border p-2 rounded">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded">
                Se connecter
            </button>
        </form>
    </div>

    <script>
        function simulerConnexion(event) {
            event.preventDefault();
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
